name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: v0.1.${{ github.run_number }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags for the release notes

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew test

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. See README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # versionCode/versionName come from GITHUB_RUN_NUMBER (see app/build.gradle.kts).
      - name: Build and sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Collect and verify APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk rubato-eq.apk
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs rubato-eq.apk

      - name: Release notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v0.1.*' 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then RANGE="$PREVIOUS_TAG..HEAD"; else RANGE="HEAD"; fi
          git log --no-merges --pretty=format:'- %s' $RANGE > release-notes.md
          if [ ! -s release-notes.md ]; then echo "- No changes since $PREVIOUS_TAG" > release-notes.md; fi
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" rubato-eq.apk \
            --title "$TAG" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --latest
